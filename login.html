<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Credentials — Secure Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Ambient Stars & Floating Slabs Background -->
  <div class="fullscreen-ambient">
    <canvas id="starsCanvas"></canvas>
    <div class="nebula-glow nebula-purple" id="nebulaPurple"></div>
    <div class="nebula-glow nebula-emerald" id="nebulaEmerald"></div>

    <!-- 2 Large Floating Frosted 3D Slabs -->
    <div class="floating-slab slab-left"></div>
    <div class="floating-slab slab-right"></div>
  </div>

  <!-- Main Container -->
  <div class="showcase-wrapper">
    <div class="canvas-window top-window" id="topWindow">
      <!-- Window Chrome Header -->
      <header class="window-bar">
        <div class="mac-dots">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
        </div>
        <div class="window-title"></div>
        <div class="window-meta">Pixelvault_io</div>
      </header>

      <!-- Live Stage Area -->
      <div class="live-stage-wrapper">

        <!-- Flow Navigation -->
        <div class="flow-nav-bar">
          <span class="flow-tab active">
            <span class="flow-badge">1</span>
            <span>User Credentials</span>
          </span>
          <span class="flow-arrow" aria-hidden="true">→</span>
          <a href="index.html" class="flow-tab" style="text-decoration: none;">
            <span class="flow-badge">2</span>
            <span>2FA Verification</span>
          </a>
        </div>

        <!-- User Credentials Card -->
        <div class="panel credentials-panel" style="display: flex;">
          <div class="auth-header">
            <div class="security-badge-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" />
                <circle cx="12" cy="10" r="2.5" stroke="#ffffff" />
                <path d="M12 12.5v3" stroke="#ffffff" stroke-linecap="round" />
              </svg>
            </div>
            <h2 class="title">User Credentials</h2>
            <p class="subtitle">Enter your login ID & password to proceed to 2FA</p>
          </div>

          <form action="index.html" method="GET" class="auth-form" id="standaloneLoginForm">
            <div class="input-group">
              <div class="input-label-row">
                <label for="standaloneUserId">User ID / Email</label>
                <span class="field-hint">Required</span>
              </div>
              <div class="input-wrapper">
                <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input type="text" id="standaloneUserId" name="email" class="auth-input" value="you@example.com" placeholder="name@domain.com" required>
              </div>
            </div>

            <div class="input-group">
              <div class="input-label-row">
                <label for="standalonePassword">Password</label>
                <span class="forgot-link">Default: Password#2026</span>
              </div>
              <div class="input-wrapper">
                <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input type="password" id="standalonePassword" class="auth-input" value="SecurityVault#2026" placeholder="Enter secure password" required>
                <button type="button" class="btn-toggle-pw" id="standaloneTogglePw" title="Toggle password visibility">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-options-row">
              <label class="remember-label">
                <input type="checkbox" checked>
                <span class="custom-chk"></span>
                <span>Remember session</span>
              </label>
              <span class="security-chip">
                <span class="chip-dot"></span> 256-bit Encrypted
              </span>
            </div>

            <button type="submit" class="btn-primary-auth">
              <span>Sign In & Continue to 2FA</span>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </form>

          <div class="auth-footer-row">
            <a href="index.html" class="btn-direct-otp" style="text-decoration: none;">
              ⚡ Direct to 3D 7-Cube OTP
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Starfield Background
    const canvas = document.getElementById('starsCanvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      let width = 0, height = 0;
      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
      }
      resize();
      window.addEventListener('resize', resize);
      const stars = [];
      for (let i = 0; i < 85; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 1.4 + 0.3,
          alpha: Math.random() * 0.75 + 0.2,
          speed: Math.random() * 0.25 + 0.08,
          twinkle: (Math.random() * 0.015 + 0.005) * (Math.random() > 0.5 ? 1 : -1)
        });
      }
      function render() {
        ctx.clearRect(0, 0, width, height);
        stars.forEach(s => {
          s.alpha += s.twinkle;
          if (s.alpha > 0.85) s.twinkle = -Math.abs(s.twinkle);
          if (s.alpha < 0.15) s.twinkle = Math.abs(s.twinkle);
          s.y -= s.speed;
          if (s.y < 0) { s.y = height; s.x = Math.random() * width; }
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, Math.min(1, s.alpha))})`;
          ctx.fill();
        });
        requestAnimationFrame(render);
      }
      render();
    }

    // Toggle Password Visibility
    const pwInput = document.getElementById('standalonePassword');
    const toggleBtn = document.getElementById('standaloneTogglePw');
    if (toggleBtn && pwInput) {
      toggleBtn.addEventListener('click', () => {
        const isPw = pwInput.type === 'password';
        pwInput.type = isPw ? 'text' : 'password';
        toggleBtn.style.color = isPw ? '#8b5cf6' : '#94a3b8';
      });
    }

    // Pass email to index.html via localStorage
    const form = document.getElementById('standaloneLoginForm');
    if (form) {
      form.addEventListener('submit', () => {
        const email = document.getElementById('standaloneUserId').value.trim() || 'you@example.com';
        localStorage.setItem('user_email', email);
      });
    }
  </script>
</body>
</html>
